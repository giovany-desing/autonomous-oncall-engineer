project:
  name: moto-chatbot
  root_path: /Users/yovany/Desktop/moto-chatbot-aws
  language: python

knowledge_base:
  path: /Users/yovany/Desktop/moto-chatbot-aws/.oncall/knowledge_base.json

aws:
  region: us-east-1
  resource_tag:
    key: oncall-project
    value: moto-chatbot
  log_groups:
    - /aws/lambda/moto-chatbot-dev-api
    - /aws/lambda/moto-chatbot-dev-worker

llm:
  hypothesis:
    provider: groq
    model: openai/gpt-oss-120b
  escalation:
    provider: bedrock
    model: anthropic.claude-sonnet-5
    region: us-east-1

notifications:
  channel: slack
  webhook_env_var: SLACK_WEBHOOK_URL

memory:
  postmortem_store_path: s3://oncall-agent-memory-531728396479/moto-chatbot/postmortems.json

source:
  repo: giovany-desing/moto-chatbot-aws
