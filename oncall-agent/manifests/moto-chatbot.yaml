project:
  name: moto-chatbot
  root_path: /Users/yovany/Desktop/moto-chatbot-aws
  language: python

knowledge_base:
  path: /Users/yovany/Desktop/moto-chatbot-aws/.oncall/knowledge_base.json

aws:
  region: us-east-1
  resource_tag:
    key: oncall-project
    value: moto-chatbot
  log_groups:
    - /aws/lambda/moto-chatbot-dev-api
