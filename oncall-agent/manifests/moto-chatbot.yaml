    provider: bedrock
    model: anthropic.claude-3-5-sonnet-20241022-v2:0
    region: us-east-1

notifications:
  channel: slack
  webhook_env_var: SLACK_WEBHOOK_URL

memory:
  postmortem_store_path: s3://oncall-agent-memory-531728396479/moto-chatbot/postmortems.json
