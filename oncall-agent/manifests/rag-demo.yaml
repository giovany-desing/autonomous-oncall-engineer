project:
  name: rag-demo
  root_path: ../../monitored-systems/rag-demo
  language: python

knowledge_base:
  path: ../../monitored-systems/rag-demo/.oncall/knowledge_base.json

aws:
  region: us-east-1
  # Tag que usa aws_resource_adapter.py para descubrir infraestructura
  # vía Resource Groups Tagging API
  resource_tag:
    key: oncall-project
    value: rag-demo
  log_groups:
    - /aws/lambda/rag-demo-handler

llm:
  hypothesis:
    provider: groq
    model: llama-3.3-70b-versatile
  escalation:
    provider: bedrock
    model: anthropic.claude-3-5-sonnet-20241022-v2:0
    region: us-east-1

notifications:
  channel: slack
  webhook_env_var: SLACK_WEBHOOK_URL

memory:
  postmortem_store_path: ../../monitored-systems/rag-demo/.oncall/postmortems.json
