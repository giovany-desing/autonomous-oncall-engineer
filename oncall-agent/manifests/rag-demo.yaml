project:
  name: rag-demo
  root_path: ../../monitored-systems/rag-demo
  language: python

knowledge_base:
  path: ../../monitored-systems/rag-demo/.oncall/knowledge_base.json

aws:
  region: us-east-1
  # Tag que usa aws_resource_adapter.py para descubrir infraestructura
  # vía Resource Groups Tagging API
  resource_tag:
    key: oncall-project
    value: rag-demo
  log_groups:
    - /aws/lambda/rag-demo-handler

llm:
  hypothesis:
    provider: groq
    model: openai/gpt-oss-120b
  escalation:
    provider: bedrock
    model: anthropic.claude-sonnet-5
    region: us-east-1

notifications:
  channel: slack
  webhook_env_var: SLACK_WEBHOOK_URL

memory:
  postmortem_store_path: s3://oncall-agent-memory-531728396479/rag-demo/postmortems.json

probe:
  s3_bucket: rag-demo-uploads-531728396479
  injected_payload: '{esto no es json valido, sonda sintetica}'
  injected_key_prefix: uploads/oncall-agent-probe
