name: Deploy Autonomous On-Call Agent

on:
  push:
    branches: [main]
    paths:
      - 'oncall-agent/**'
      - 'monitored-systems/rag-demo/**'
  repository_dispatch:
    types: [project_updated]

jobs:
  rebuild-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout autonomous-oncall-engineer
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Instalar dependencias del onboarding
        working-directory: oncall-agent
        run: |
          python -m pip install --upgrade pip
          pip install tree-sitter==0.23.2 tree-sitter-language-pack==0.7.2 groq==1.5.0 python-dotenv==1.2.2 pyyaml==6.0.2 boto3==1.35.97 pytest==8.3.4 pytest-mock==3.14.0 requests==2.34.2 fastembed==0.4.2

      - name: Correr tests automatizados
        working-directory: oncall-agent
        run: |
          python -m pytest tests/ -v

      - name: Determinar proyecto disparador
        id: project
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "name=${{ github.event.client_payload.project }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=rag-demo" >> "$GITHUB_OUTPUT"
          fi

      - name: Clonar dinamicamente TODOS los proyectos externos declarados
        working-directory: oncall-agent
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_CLONE_TOKEN }}
        run: |
          mkdir -p ../external-projects
          for manifest in manifests/*.yaml; do
            base=$(basename "$manifest" .yaml)
            if [[ "$base" == *-lambda ]]; then
              continue
            fi
            repo=$(python onboarding/extract_source_repo.py "$manifest")
            if [ -n "$repo" ]; then
              echo "Clonando $repo para el proyecto $base..."
              gh repo clone "$repo" "../external-projects/$base" -- --depth 1
            fi
          done

      - name: Regenerar base de conocimiento del proyecto disparador
        working-directory: oncall-agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          PROJECT="${{ steps.project.outputs.name }}"
          if [ "$PROJECT" = "rag-demo" ]; then
            SOURCE_PATH="../monitored-systems/rag-demo"
          else
            SOURCE_PATH="../external-projects/$PROJECT"
          fi
          mkdir -p "/tmp/kb-output"
          python onboarding/risk_map.py "$SOURCE_PATH" "/tmp/kb-output/knowledge_base.json"
          aws s3 cp "/tmp/kb-output/knowledge_base.json" \
            "s3://oncall-agent-memory-531728396479/knowledge-bases/$PROJECT/knowledge_base.json"
          echo "SOURCE_PATH=$SOURCE_PATH" >> "$GITHUB_ENV"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Subir codigo fuente completo a S3 (para el chat conversacional)
        working-directory: oncall-agent
        run: |
          python onboarding/upload_source_to_s3.py "$SOURCE_PATH" "$PROJECT"

      - name: Descargar TODAS las bases de conocimiento existentes desde S3
        run: |
          mkdir -p /tmp/build/all-knowledge-bases
          aws s3 sync s3://oncall-agent-memory-531728396479/knowledge-bases/ /tmp/build/all-knowledge-bases/

      - name: Instalar dependencias de Lambda (sin boto3/botocore)
        run: |
          mkdir -p /tmp/build/package
          grep -v -E "^(boto3|botocore)" oncall-agent/requirements.txt > /tmp/requirements-lambda.txt
          pip install \
            -r /tmp/requirements-lambda.txt \
            --target /tmp/build/package \
            --platform manylinux2014_aarch64 \
            --python-version 3.12 \
            --only-binary=:all: \
            --upgrade

      - name: Copiar codigo fuente del agente al paquete
        run: |
          rsync -a \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'infra' \
            --exclude '*.md' \
            oncall-agent/ /tmp/build/package/
          find /tmp/build/package -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

      - name: Copiar todas las bases de conocimiento al paquete
        run: |
          for kb_dir in /tmp/build/all-knowledge-bases/*/; do
            project=$(basename "$kb_dir")
            mkdir -p "/tmp/build/package/monitored-systems/$project/.oncall"
            cp "$kb_dir/knowledge_base.json" "/tmp/build/package/monitored-systems/$project/.oncall/"
          done
          echo "Bases de conocimiento incluidas en el paquete:"
          find /tmp/build/package/monitored-systems -name "knowledge_base.json"

      - name: Generar manifiestos de Lambda para todos los proyectos
        working-directory: oncall-agent
        run: |
          for manifest in manifests/*.yaml; do
            base=$(basename "$manifest" .yaml)
            if [[ "$base" == *-lambda ]]; then
              continue
            fi
            python onboarding/generate_lambda_manifest.py "$manifest" "manifests/${base}-lambda.yaml"
            cp "manifests/${base}.yaml" "manifests/${base}-lambda.yaml" /tmp/build/package/manifests/
          done

      - name: Generar el zip
        run: |
          cd /tmp/build/package
          zip -r -X -q /tmp/build/agent.zip .
          du -sh /tmp/build/agent.zip

      - name: Subir el zip a S3
        run: |
          aws s3 cp /tmp/build/agent.zip s3://oncall-agent-deployments-531728396479/agent.zip

      - name: Desplegar en las tres Lambdas
        run: |
          aws lambda update-function-code \
            --function-name oncall-agent-diagnosis \
            --s3-bucket oncall-agent-deployments-531728396479 \
            --s3-key agent.zip
          aws lambda wait function-updated --function-name oncall-agent-diagnosis
          aws lambda update-function-code \
            --function-name oncall-agent-synthetic-probe \
            --s3-bucket oncall-agent-deployments-531728396479 \
            --s3-key agent.zip
          aws lambda wait function-updated --function-name oncall-agent-synthetic-probe
          aws lambda update-function-code \
            --function-name oncall-agent-slack-events \
            --s3-bucket oncall-agent-deployments-531728396479 \
            --s3-key agent.zip
          aws lambda wait function-updated --function-name oncall-agent-slack-events

      - name: Smoke test post-deploy
        working-directory: oncall-agent
        run: |
          python tests/smoke_test_post_deploy.py
